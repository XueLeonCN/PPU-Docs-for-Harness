acity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="149.0" y="123.7" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">0</text><rect x="170.0" y="112.0" width="46.0" height="17.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="193.0" y="123.7" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">260</text><rect x="216.0" y="112.0" width="50.0" height="17.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="241.0" y="123.7" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">0</text><rect x="266.0" y="112.0" width="44.0" height="17.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="288.0" y="123.7" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">0</text><rect x="78.0" y="129.0" width="50.0" height="17.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="103.0" y="140.7" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">1</text><rect x="128.0" y="129.0" width="42.0" height="17.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="149.0" y="140.7" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">0</text><rect x="170.0" y="129.0" width="46.0" height="17.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="193.0" y="140.7" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">260</text><rect x="216.0" y="129.0" width="50.0" height="17.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="241.0" y="140.7" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">0</text><rect x="266.0" y="129.0" width="44.0" height="17.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="288.0" y="140.7" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">0</text><rect x="78.0" y="146.0" width="50.0" height="17.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="103.0" y="157.7" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">2</text><rect x="128.0" y="146.0" width="42.0" height="17.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="149.0" y="157.7" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">0</text><rect x="170.0" y="146.0" width="46.0" height="17.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="193.0" y="157.7" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">260</text><rect x="216.0" y="146.0" width="50.0" height="17.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="241.0" y="157.7" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">0</text><rect x="266.0" y="146.0" width="44.0" height="17.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="288.0" y="157.7" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">0</text><rect x="78.0" y="163.0" width="50.0" height="17.0" fill="#dde6ec" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="103.0" y="174.7" font-size="9" fill="#a02b2b" text-anchor="middle" font-weight="700">3</text><rect x="128.0" y="163.0" width="42.0" height="17.0" fill="#dde6ec" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="149.0" y="174.7" font-size="9" fill="#a02b2b" text-anchor="middle" font-weight="700">1</text><rect x="170.0" y="163.0" width="46.0" height="17.0" fill="#dde6ec" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="193.0" y="174.7" font-size="9" fill="#a02b2b" text-anchor="middle" font-weight="700">130</text><rect x="216.0" y="163.0" width="50.0" height="17.0" fill="#dde6ec" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="241.0" y="174.7" font-size="9" fill="#a02b2b" text-anchor="middle" font-weight="700">3</text><rect x="266.0" y="163.0" width="44.0" height="17.0" fill="#dde6ec" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="288.0" y="174.7" font-size="9" fill="#a02b2b" text-anchor="middle" font-weight="700">260</text><rect x="78.0" y="180.0" width="50.0" height="17.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="103.0" y="191.7" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">4</text><rect x="128.0" y="180.0" width="42.0" height="17.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="149.0" y="191.7" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">1</text><rect x="170.0" y="180.0" width="46.0" height="17.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="193.0" y="191.7" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">130</text><rect x="216.0" y="180.0" width="50.0" height="17.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="241.0" y="191.7" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">3</text><rect x="266.0" y="180.0" width="44.0" height="17.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="288.0" y="191.7" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">260</text><path d="M70,112 L65,112 L65,163 L70,163" fill="none" stroke="#a89c83" stroke-width="1"/><text x="60.0" y="138.0" font-size="8.5" fill="#8a8069" text-anchor="end" font-weight="400">专家 0</text><path d="M70,163 L65,163 L65,197 L70,197" fill="none" stroke="#a89c83" stroke-width="1"/><text x="60.0" y="189.0" font-size="8.5" fill="#8a8069" text-anchor="end" font-weight="400">专家 1</text><text x="34.0" y="216.0" font-size="9" fill="#211d15" text-anchor="start" font-weight="400">同一专家的每个块都存同一份 (x,y,z,w)：</text><text x="34.0" y="229.0" font-size="9" fill="#8a8069" text-anchor="start" font-weight="400">数组按块展开，取下标即完成"选组"，</text><text x="34.0" y="242.0" font-size="9" fill="#8a8069" text-anchor="start" font-weight="400">不需要在 kernel 里再查 m_indices。</text><rect x="34" y="252" width="268" height="30" rx="3" fill="#e0e8d7" fill-opacity="0.5" stroke="#a89c83"/><text x="42.0" y="265.0" font-size="9" fill="#3f6b34" text-anchor="start" font-weight="700">aligned_num_m_blocks = 5</text><text x="42.0" y="277.0" font-size="9" fill="#8a8069" text-anchor="start" font-weight="400">→ 总 tile 数 = 5 × kNumNBlocks = 10</text><line x1="316" y1="180" x2="340" y2="180" stroke="#a02b2b" stroke-width="1.2" marker-end="url(#s6r)"/><rect x="344" y="52" width="258" height="264" rx="5" fill="#fdfbf5" stroke="#a89c83"/><path d="M349,52 L597,52 Q602,52 602,57 L602,76 L344,76 L344,57 Q344,52 349,52 z" fill="#dde6ec"/><text x="354.0" y="69.0" font-size="11" fill="#211d15" text-anchor="start" font-weight="700">fetch_next_work（跟一个 block 走一遍）</text><text x="354.0" y="90.0" font-size="8.8" fill="#8a8069" text-anchor="start" font-weight="400">假设它这一轮拿到 next_block_idx = 7</text><rect x="356" y="94" width="234" height="22" rx="3" fill="#f4efe3" fill-opacity="0.8" stroke="#a89c83" stroke-width="0.5"/><text x="362.0" y="108.0" font-size="8.0" fill="#211d15" text-anchor="start" font-weight="400">next_block_idx = iter×grid + blockIdx</text><text x="584.0" y="108.0" font-size="8.6" fill="#a02b2b" text-anchor="end" font-weight="700">= 7</text><rect x="356" y="120" width="234" height="22" rx="3" fill="#fdfbf5" fill-opacity="0.8" stroke="#a89c83" stroke-width="0.5"/><text x="362.0" y="134.0" font-size="8.6" fill="#211d15" text-anchor="start" font-weight="400">block_m_idx = 7 ÷ kNumNBlocks(2)</text><text x="584.0" y="134.0" font-size="8.6" fill="#a02b2b" text-anchor="end" font-weight="700">= 3</text><rect x="356" y="146" width="234" height="22" rx="3" fill="#f4efe3" fill-opacity="0.8" stroke="#a89c83" stroke-width="0.5"/><text x="362.0" y="160.0" font-size="8.6" fill="#211d15" text-anchor="start" font-weight="400">__ldg 读第 3 行 → (x,y,z,w)</text><text x="584.0" y="160.0" font-size="8.6" fill="#a02b2b" text-anchor="end" font-weight="700">= (1,130,3,260)</text><rect x="356" y="172" width="234" height="22" rx="3" fill="#fdfbf5" fill-opacity="0.8" stroke="#a89c83" stroke-width="0.5"/><text x="362.0" y="186.0" font-size="8.6" fill="#211d15" text-anchor="start" font-weight="400">block_idx_in_m = 7 − z×2</text><text x="584.0" y="186.0" font-size="8.6" fill="#a02b2b" text-anchor="end" font-weight="700">= 1</text><rect x="356" y="198" width="234" height="22" rx="3" fill="#f4efe3" fill-opacity="0.8" stroke="#a89c83" stroke-width="0.5"/><text x="362.0" y="212.0" font-size="8.6" fill="#211d15" text-anchor="start" font-weight="400">num_m_blocks = ⌈130 / 128⌉</text><text x="584.0" y="212.0" font-size="8.6" fill="#a02b2b" text-anchor="end" font-weight="700">= 2</text><rect x="356" y="224" width="234" height="22" rx="3" fill="#fdfbf5" fill-opacity="0.8" stroke="#a89c83" stroke-width="0.5"/><text x="362.0" y="238.0" font-size="8.6" fill="#211d15" text-anchor="start" font-weight="400">组内 swizzle(block_idx_in_m=1)</text><text x="584.0" y="238.0" font-size="8.6" fill="#a02b2b" text-anchor="end" font-weight="700">→ m=1, n=0</text><text x="356.0" y="276.0" font-size="9" fill="#3f6b34" text-anchor="start" font-weight="600">整个过程只有一次 __ldg，没有任何间接查表。</text><line x1="604" y1="180" x2="622" y2="180" stroke="#a02b2b" stroke-width="1.2" marker-end="url(#s6r)"/><rect x="626" y="52" width="332" height="264" rx="5" fill="#fdfbf5" stroke="#a89c83"/><path d="M631,52 L953,52 Q958,52 958,57 L958,76 L626,76 L626,57 Q626,52 631,52 z" fill="#dde6ec"/><text x="636.0" y="69.0" font-size="11" fill="#211d15" text-anchor="start" font-weight="700">四个字段各自的落点（代入本例）</text><text x="636.0" y="90.0" font-size="8.8" fill="#8a8069" text-anchor="start" font-weight="400">每个字段只管一件事，互不交叉</text><rect x="638" y="100" width="308" height="40" rx="3" fill="#dde6ec" fill-opacity="0.45" stroke="#a89c83"/><rect x="646.0" y="108.0" width="52.0" height="17.0" fill="#fdfbf5" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="672.0" y="119.7" font-size="9.5" fill="#a02b2b" text-anchor="middle" font-weight="700">x = 1</text><text x="706.0" y="121.0" font-size="9.5" fill="#211d15" text-anchor="start" font-weight="700">选 B 与 scale</text><text x="646.0" y="134.0" font-size="9" fill="#8a8069" text-anchor="start" font-weight="400">W[专家 1] 的 N×K 切片 + 对应 scale</text><rect x="638" y="148" width="308" height="40" rx="3" fill="#dde6ec" fill-opacity="0.45" stroke="#a89c83"/><rect x="646.0" y="156.0" width="52.0" height="17.0" fill="#fdfbf5" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="672.0" y="167.7" font-size="9.5" fill="#a02b2b" text-anchor="middle" font-weight="700">y = 130</text><text x="706.0" y="169.0" font-size="9.5" fill="#211d15" text-anchor="start" font-weight="700">定组内块数与尾块</text><text x="646.0" y="182.0" font-size="9" fill="#8a8069" text-anchor="start" font-weight="400">valid_m = min(128, 130−1×128) = 2 行</text><rect x="638" y="196" width="308" height="40" rx="3" fill="#e0e8d7" fill-opacity="0.45" stroke="#a89c83"/><rect x="646.0" y="204.0" width="52.0" height="17.0" fill="#fdfbf5" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="672.0" y="215.7" font-size="9.5" fill="#a02b2b" text-anchor="middle" font-weight="700">z = 3</text><text x="706.0" y="217.0" font-size="9.5" fill="#211d15" text-anchor="start" font-weight="700">定位 sorted_token_ids</text><text x="646.0" y="230.0" font-size="9" fill="#8a8069" text-anchor="start" font-weight="400">块号 = m+z = 4 → 行偏移 4×128 = 512</text><rect x="638" y="244" width="308" height="40" rx="3" fill="#e0e8d7" fill-opacity="0.45" stroke="#a89c83"/><rect x="646.0" y="252.0" width="52.0" height="17.0" fill="#fdfbf5" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="672.0" y="263.7" font-size="9.5" fill="#a02b2b" text-anchor="middle" font-weight="700">w = 260</text><text x="706.0" y="265.0" font-size="9.5" fill="#211d15" text-anchor="start" font-weight="700">定位 D 的写出行</text><text x="646.0" y="278.0" font-size="9" fill="#8a8069" text-anchor="start" font-weight="400">行基址 = 260 + 1×128 = 388</text><text x="638.0" y="300.0" font-size="9" fill="#211d15" text-anchor="start" font-weight="400">尾块只写 2 行 —— Nopad 的"段间紧密拼接"在 GEMM 侧就落在这里。</text><rect x="22" y="330" width="936" height="94" rx="5" fill="#fdfbf5" stroke="#a89c83"/><text x="34.0" y="350.0" font-size="11" fill="#211d15" text-anchor="start" font-weight="700">组内 swizzle：kNum1DBlocksPerGroup=2 × kNumNBlocks=2 → 每 4 个 tile 一簇，簇内先沿 M 走两步再换 N</text><text x="44.0" y="366.0" font-size="9" fill="#8a8069" text-anchor="start" font-weight="400">block_idx_in_m</text><text x="44.0" y="384.0" font-size="9" fill="#8a8069" text-anchor="start" font-weight="400">m_block_idx</text><text x="44.0" y="402.0" font-size="9" fill="#8a8069" text-anchor="start" font-weight="400">n_block_idx</text><rect x="150.0" y="356.0" width="44.0" height="14.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="172.0" y="366.2" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">0</text><rect x="150.0" y="374.0" width="44.0" height="14.0" fill="#dde6ec" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="172.0" y="384.2" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">0</text><rect x="150.0" y="392.0" width="44.0" height="14.0" fill="#e0e8d7" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="172.0" y="402.2" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">0</text><rect x="212.0" y="356.0" width="44.0" height="14.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="234.0" y="366.2" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">1</text><rect x="212.0" y="374.0" width="44.0" height="14.0" fill="#dde6ec" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="234.0" y="384.2" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">1</text><rect x="212.0" y="392.0" width="44.0" height="14.0" fill="#e0e8d7" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="234.0" y="402.2" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">0</text><rect x="274.0" y="356.0" width="44.0" height="14.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="296.0" y="366.2" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">2</text><rect x="274.0" y="374.0" width="44.0" height="14.0" fill="#dde6ec" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="296.0" y="384.2" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">0</text><rect x="274.0" y="392.0" width="44.0" height="14.0" fill="#e0e8d7" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="296.0" y="402.2" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">1</text><rect x="336.0" y="356.0" width="44.0" height="14.0" fill="#f4efe3" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="358.0" y="366.2" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">3</text><rect x="336.0" y="374.0" width="44.0" height="14.0" fill="#dde6ec" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="358.0" y="384.2" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">1</text><rect x="336.0" y="392.0" width="44.0" height="14.0" fill="#e0e8d7" fill-opacity="0.9" stroke="#a89c83" stroke-width="0.6"/><text x="358.0" y="402.2" font-size="9" fill="#211d15" text-anchor="middle" font-weight="400">1</text><rect x="147" y="389" width="112" height="20" rx="2" fill="none" stroke="#a02b2b" stroke-width="1" stroke-dasharray="3,2"/><rect x="271" y="389" width="112" height="20" rx="2" fill="none" stroke="#a02b2b" stroke-width="1" stroke-dasharray="3,2"/><text x="212.0" y="420.0" font-size="8.5" fill="#a02b2b" text-anchor="middle" font-weight="400">n 相同的一对</text><text x="336.0" y="420.0" font-size="8.5" fill="#a02b2b" text-anchor="middle" font-weight="400">n 相同的一对</text><text x="420.0" y="366.0" font-size="9.5" fill="#211d15" text-anchor="start" font-weight="400">相邻两个 tile 的 n_block_idx 相同 → 它们要读的 B tile 完全是同一块，</text><text x="420.0" y="382.0" font-size="9.5" fill="#8a8069" text-anchor="start" font-weight="400">被相邻 CU 几乎同时取用时命中 L2；沿 M 换块只影响 A 的读取，而 A 本来就是逐行 gather。</text><text x="420.0" y="404.0" font-size="9.5" fill="#8a8069" text-anchor="start" font-weight="400">簇尾用 num_blocks_in_group = min(2, num_m_blocks − first_block_idx) 收口，组内块数为奇数时不会越界。</text></svg>