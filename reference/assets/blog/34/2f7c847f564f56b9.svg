<svg viewBox="0 0 980 386" xmlns="http://www.w3.org/2000/svg" font-family="PingFang SC, sans-serif"><defs><marker id="d8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8069"/></marker><marker id="d8g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3f6b34"/></marker></defs><text x="22.0" y="26.0" font-size="12.5" fill="#211d15" text-anchor="start" font-weight="700">Hybrid 数据流：索引走绿线，token 数据走灰线，两层不交叉</text><text x="958.0" y="26.0" font-size="10" fill="#8a8069" text-anchor="end" font-weight="400">GEMM1 用 fused（gather 读）· GEMM2 用 nopad（连续读）</text><rect x="22" y="56" width="140" height="52" rx="5" fill="#e0e8d7" stroke="#3f6b34"/><text x="92.0" y="76.0" font-size="11" fill="#3f6b34" text-anchor="middle" font-weight="700">moe_align_block_size</text><text x="92.0" y="91.0" font-size="9" fill="#8a8069" text-anchor="middle" font-weight="400">只算索引 · 7~93 µs</text><path d="M162,82 L174,82 L174,118 L880,118" fill="none" stroke="#3f6b34" stroke-width="2"/><text x="940.0" y="122.0" font-size="9.5" fill="#3f6b34" text-anchor="end" font-weight="400">索引总线</text><rect x="184" y="80" width="176" height="24" rx="3" fill="#e0e8d7" fill-opacity="0.7" stroke="#3f6b34" stroke-width="0.8"/><text x="272.0" y="96.0" font-size="9.5" fill="#3f6b34" text-anchor="middle" font-weight="600">sorted_token_ids + 描述符</text><line x1="272" y1="104" x2="272" y2="118" stroke="#3f6b34" stroke-width="1"/><line x1="272" y1="118" x2="272" y2="182" stroke="#3f6b34" stroke-width="1.2" marker-end="url(#d8g)"/><rect x="502" y="80" width="152" height="24" rx="3" fill="#e0e8d7" fill-opacity="0.7" stroke="#3f6b34" stroke-width="0.8"/><text x="578.0" y="96.0" font-size="9.5" fill="#3f6b34" text-anchor="middle" font-weight="600">m_indices + 描述符</text><line x1="578" y1="104" x2="578" y2="118" stroke="#3f6b34" stroke-width="1"/><line x1="578" y1="118" x2="578" y2="182" stroke="#3f6b34" stroke-width="1.2" marker-end="url(#d8g)"/><rect x="708" y="80" width="92" height="24" rx="3" fill="#e0e8d7" fill-opacity="0.7" stroke="#3f6b34" stroke-width="0.8"/><text x="754.0" y="96.0" font-size="9.5" fill="#3f6b34" text-anchor="middle" font-weight="600">inv_perm</text><line x1="754" y1="104" x2="754" y2="118" stroke="#3f6b34" stroke-width="1"/><line x1="754" y1="118" x2="754" y2="182" stroke="#3f6b34" stroke-width="1.2" marker-end="url(#d8g)"/><text x="22.0" y="148.0" font-size="9.5" fill="#3f6b34" text-anchor="start" font-weight="400">总线上只有下标，没有数据</text><rect x="22" y="186" width="108" height="56" rx="5" fill="#f4efe3" stroke="#a89c83"/><text x="76.0" y="206.0" font-size="11" fill="#211d15" text-anchor="middle" font-weight="700">hidden_states</text><text x="76.0" y="221.0" font-size="9" fill="#8a8069" text-anchor="middle" font-weight="400">原始 token 序 [M,K]</text><rect x="166" y="186" width="140" height="56" rx="5" fill="#dde6ec" stroke="#2a5780"/><text x="236.0" y="206.0" font-size="11" fill="#2a5780" text-anchor="middle" font-weight="700">GEMM1 · fused</text><text x="236.0" y="221.0" font-size="9" fill="#8a8069" text-anchor="middle" font-weight="400">按 sorted_token_ids</text><text x="236.0" y="234.0" font-size="9" fill="#8a8069" text-anchor="middle" font-weight="400">gather 读 A</text><rect x="342" y="186" width="130" height="56" rx="5" fill="#f4efe3" stroke="#a89c83"/><text x="407.0" y="206.0" font-size="11" fill="#211d15" text-anchor="middle" font-weight="700">SiLU·mul + quant</text><text x="407.0" y="221.0" font-size="9" fill="#8a8069" text-anchor="middle" font-weight="400">按 nopad 段序写出</text><rect x="508" y="186" width="140" height="56" rx="5" fill="#dde6ec" stroke="#2a5780"/><text x="578.0" y="206.0" font-size="11" fill="#2a5780" text-anchor="middle" font-weight="700">GEMM2 · nopad</text><text x="578.0" y="221.0" font-size="9" fill="#8a8069" text-anchor="middle" font-weight="400">连续读 A</text><text x="578.0" y="234.0" font-size="9" fill="#8a8069" text-anchor="middle" font-weight="400">（不需要 gather）</text><rect x="684" y="186" width="140" height="56" rx="5" fill="#e0e8d7" stroke="#3f6b34"/><text x="754.0" y="206.0" font-size="11" fill="#3f6b34" text-anchor="middle" font-weight="700">ep_gather</text><text x="754.0" y="221.0" font-size="9" fill="#8a8069" text-anchor="middle" font-weight="400">恢复顺序 + 加权 + 求和</text><line x1="132" y1="214" x2="162" y2="214" stroke="#8a8069" stroke-width="1.3" marker-end="url(#d8)"/><line x1="308" y1="214" x2="338" y2="214" stroke="#8a8069" stroke-width="1.3" marker-end="url(#d8)"/><line x1="474" y1="214" x2="504" y2="214" stroke="#8a8069" stroke-width="1.3" marker-end="url(#d8)"/><line x1="650" y1="214" x2="680" y2="214" stroke="#8a8069" stroke-width="1.3" marker-end="url(#d8)"/><rect x="860" y="186" width="98" height="56" rx="5" fill="#f4efe3" stroke="#a89c83"/><text x="909.0" y="206.0" font-size="11" fill="#211d15" text-anchor="middle" font-weight="700">输出 [M,K2]</text><text x="909.0" y="221.0" font-size="9" fill="#8a8069" text-anchor="middle" font-weight="400">恢复原始 token 序</text><line x1="826" y1="214" x2="856" y2="214" stroke="#8a8069" stroke-width="1.3" marker-end="url(#d8)"/><rect x="620" y="276" width="280" height="26" rx="5" fill="#f4efe3" stroke="#a89c83"/><text x="760.0" y="293.0" font-size="11" fill="#211d15" text-anchor="middle" font-weight="700">topk_weights（来自路由，不经 moe_align）</text><line x1="754" y1="274" x2="754" y2="246" stroke="#8a8069" stroke-width="1.2" marker-end="url(#d8)"/><rect x="22" y="322" width="936" height="52" rx="4" fill="#f3ddd0" fill-opacity="0.5" stroke="#a02b2b" stroke-width="0.9"/><text x="36.0" y="341.0" font-size="11" fill="#211d15" text-anchor="start" font-weight="400">A 一直保持原始 token 顺序，D 一直写在 nopad 段内 —— 全程没有一次以"把数据摆好"为目的的拷贝：GEMM1 用 gather 读把重排吸进访存，</text><text x="36.0" y="358.0" font-size="11" fill="#a02b2b" text-anchor="start" font-weight="700">act 顺手按 nopad 段序写出，GEMM2 因此可以连续读；顺序的恢复推迟到 ep_gather，与加权、求和三件事合成一个 kernel。</text></svg>