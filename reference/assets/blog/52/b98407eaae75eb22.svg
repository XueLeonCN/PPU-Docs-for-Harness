<svg xmlns="http://www.w3.org/2000/svg" height="692.364" style="display:block" viewBox="0 0 1100 680" width="1120"><rect fill="#fdfbf5" height="680" width="1100" x="0" y="0" /><title>普通 FP8 GEMM 与 blockwise FP8 GEMM 的 A/B、SFA/SFB 读取和 promotion 对比</title><text fill="#211d15" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="18.660714" font-weight="600" text-anchor="start" x="24" y="30">普通 GEMM 与 blockwise GEMM：scale 读取与 K128 promotion</text><text fill="#8a8069" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.767857" font-weight="normal" text-anchor="start" x="24" y="57">共同流水：A/B 从 global 搬入四个 TSM stage；内层预取下一批 A/B，同时计算当前批。</text><text fill="#8a8069" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="start" x="24" y="80">两行都用 FP8 的 K32 内循环；单 warp 顺序示意，读取框表示先后，不表示实际耗时。</text><defs><marker id="f1-next" markerHeight="4" markerWidth="4" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path d="M0,0 L10,5 L0,10 z" fill="#9a6b13" /></marker></defs><g class="pipeline-panel" data-kind="ordinary"><text fill="#211d15" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14.732143" font-weight="600" text-anchor="start" x="24" y="116">普通 FP8 GEMM</text><text fill="#2a5780" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.767857" font-weight="normal" text-anchor="start" x="24" y="139">global → TSM：A/B</text><text fill="#211d15" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.767857" font-weight="600" text-anchor="middle" x="448" y="163">一个 K128：4 个 K32 内循环</text><path d="M248,172 v-5 h400 v5" fill="none" stroke="#e3dac2" /><text fill="#2a5780" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14.732143" font-weight="600" text-anchor="start" x="24" y="199">A/B tsm.ld</text><text fill="#8a8069" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="start" x="24" y="217">TSM → VREG</text><text fill="#9a6b13" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14.732143" font-weight="600" text-anchor="start" x="24" y="247">scale tsm.ld</text><text fill="#8a8069" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="start" x="24" y="265">TSM → VREG</text><text fill="#2a5780" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14.732143" font-weight="600" text-anchor="start" x="24" y="307">MMA / ACC</text><text fill="#8a8069" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="start" x="24" y="325">直接累加</text><rect fill="#2a5780" height="38" opacity="0.13" rx="2" stroke="none" width="100" x="136" y="180" /><text fill="#2a5780" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="middle" x="186.0" y="204">首批 A/B 0</text><g class="k32-iteration" data-k="0"><rect fill="#2a5780" height="38" opacity="0.13" rx="2" stroke="none" width="100" x="248" y="180" /><text fill="#2a5780" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="middle" x="298.0" y="204">预取 A/B 1</text><rect fill="#2a5780" height="40" opacity="0.9" rx="1" stroke="none" width="100" x="248" y="286" /><text fill="#fdfbf5" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.767857" font-weight="600" text-anchor="middle" x="298.0" y="311">MMA 0</text></g><g class="k32-iteration" data-k="1"><rect fill="#2a5780" height="38" opacity="0.13" rx="2" stroke="none" width="100" x="348" y="180" /><text fill="#2a5780" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="middle" x="398.0" y="204">预取 A/B 2</text><rect fill="#2a5780" height="40" opacity="0.9" rx="1" stroke="none" width="100" x="348" y="286" /><text fill="#fdfbf5" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.767857" font-weight="600" text-anchor="middle" x="398.0" y="311">MMA 1</text></g><line stroke="#fdfbf5" x1="348" x2="348" y1="286" y2="326" /><g class="k32-iteration" data-k="2"><rect fill="#2a5780" height="38" opacity="0.13" rx="2" stroke="none" width="100" x="448" y="180" /><text fill="#2a5780" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="middle" x="498.0" y="204">预取 A/B 3</text><rect fill="#2a5780" height="40" opacity="0.9" rx="1" stroke="none" width="100" x="448" y="286" /><text fill="#fdfbf5" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.767857" font-weight="600" text-anchor="middle" x="498.0" y="311">MMA 2</text></g><line stroke="#fdfbf5" x1="448" x2="448" y1="286" y2="326" /><g class="k32-iteration" data-k="3"><rect fill="#3f6b34" height="38" opacity="0.13" rx="2" stroke="none" width="100" x="548" y="180" /><text fill="#3f6b34" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="middle" x="598.0" y="204">下一段 A/B 0</text><rect fill="#2a5780" height="40" opacity="0.9" rx="1" stroke="none" width="100" x="548" y="286" /><text fill="#fdfbf5" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.767857" font-weight="600" text-anchor="middle" x="598.0" y="311">MMA 3</text></g><line stroke="#fdfbf5" x1="548" x2="548" y1="286" y2="326" /><text fill="#8a8069" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.767857" font-weight="normal" text-anchor="start" x="248" y="253">无每 K128 的 SFA/SFB 读取；若有整体 scale，在 epilogue 处理。</text><rect fill="#2a5780" height="40" opacity="0.9" rx="1" stroke="none" width="100" x="648" y="286" /><text fill="#fdfbf5" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="600" text-anchor="middle" x="698.0" y="311">下一段 MMA</text><text fill="#2a5780" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.767857" font-weight="normal" text-anchor="start" x="248" y="345">一份累加器：本段 MMA 结束后，直接继续下一段 MMA。</text></g><g class="pipeline-panel" data-kind="blockwise"><text fill="#211d15" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14.732143" font-weight="600" text-anchor="start" x="24" y="384">blockwise FP8 GEMM</text><text fill="#9a6b13" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.767857" font-weight="normal" text-anchor="start" x="24" y="407">global → TSM：A/B + SFA + SFB</text><text fill="#211d15" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.767857" font-weight="600" text-anchor="middle" x="448" y="431">一个 K128：4 个 K32 内循环</text><path d="M248,440 v-5 h400 v5" fill="none" stroke="#e3dac2" /><text fill="#2a5780" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14.732143" font-weight="600" text-anchor="start" x="24" y="467">A/B tsm.ld</text><text fill="#8a8069" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="start" x="24" y="485">TSM → VREG</text><text fill="#9a6b13" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14.732143" font-weight="600" text-anchor="start" x="24" y="515">scale tsm.ld</text><text fill="#8a8069" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="start" x="24" y="533">TSM → VREG</text><text fill="#2a5780" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14.732143" font-weight="600" text-anchor="start" x="24" y="575">MMA / ACC</text><text fill="#8a8069" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="start" x="24" y="593">写 raw temp</text><rect fill="#2a5780" height="38" opacity="0.13" rx="2" stroke="none" width="100" x="136" y="448" /><text fill="#2a5780" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="middle" x="186.0" y="472">首批 A/B 0</text><g class="k32-iteration" data-k="0"><rect fill="#2a5780" height="38" opacity="0.13" rx="2" stroke="none" width="100" x="248" y="448" /><text fill="#2a5780" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="middle" x="298.0" y="472">预取 A/B 1</text><rect fill="#2a5780" height="40" opacity="0.9" rx="1" stroke="none" width="100" x="248" y="554" /><text fill="#fdfbf5" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.767857" font-weight="600" text-anchor="middle" x="298.0" y="579">MMA 0</text></g><g class="k32-iteration" data-k="1"><rect fill="#2a5780" height="38" opacity="0.13" rx="2" stroke="none" width="100" x="348" y="448" /><text fill="#2a5780" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="middle" x="398.0" y="472">预取 A/B 2</text><rect fill="#2a5780" height="40" opacity="0.9" rx="1" stroke="none" width="100" x="348" y="554" /><text fill="#fdfbf5" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.767857" font-weight="600" text-anchor="middle" x="398.0" y="579">MMA 1</text></g><line stroke="#fdfbf5" x1="348" x2="348" y1="554" y2="594" /><g class="k32-iteration" data-k="2"><rect fill="#2a5780" height="38" opacity="0.13" rx="2" stroke="none" width="100" x="448" y="448" /><text fill="#2a5780" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="middle" x="498.0" y="472">预取 A/B 3</text><rect fill="#2a5780" height="40" opacity="0.9" rx="1" stroke="none" width="100" x="448" y="554" /><text fill="#fdfbf5" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.767857" font-weight="600" text-anchor="middle" x="498.0" y="579">MMA 2</text></g><line stroke="#fdfbf5" x1="448" x2="448" y1="554" y2="594" /><g class="k32-iteration" data-k="3"><rect fill="#3f6b34" height="38" opacity="0.13" rx="2" stroke="none" width="100" x="548" y="448" /><text fill="#3f6b34" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="middle" x="598.0" y="472">下一段 A/B 0</text><rect fill="#2a5780" height="40" opacity="0.9" rx="1" stroke="none" width="100" x="548" y="554" /><text fill="#fdfbf5" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.767857" font-weight="600" text-anchor="middle" x="598.0" y="579">MMA 3</text></g><line stroke="#fdfbf5" x1="548" x2="548" y1="554" y2="594" /><g class="scale-load" data-stage="首段"><rect fill="#9a6b13" height="19" opacity="0.15" rx="2" stroke="#9a6b13" width="100" x="136" y="496" /><text fill="#9a6b13" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="middle" x="186.0" y="510">首段 SFA</text><rect fill="#9a6b13" height="19" opacity="0.15" rx="2" stroke="#9a6b13" width="100" x="136" y="517" /><text fill="#9a6b13" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="middle" x="186.0" y="531">首段 SFB</text></g><g class="scale-load" data-stage="下一段"><rect fill="#9a6b13" height="19" opacity="0.15" rx="2" stroke="#9a6b13" width="100" x="873.0" y="496" /><text fill="#9a6b13" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="middle" x="923.0" y="510">下一段 SFA</text><rect fill="#9a6b13" height="19" opacity="0.15" rx="2" stroke="#9a6b13" width="100" x="873.0" y="517" /><text fill="#9a6b13" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="middle" x="923.0" y="531">下一段 SFB</text></g><path d="M236,516 H760.5 V549" fill="none" marker-end="url(#f1-next)" stroke="#9a6b13" stroke-dasharray="4 3" /><text fill="#9a6b13" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="middle" x="393" y="509">保留本段 scale，供 promotion 使用</text><g class="promotion-stage" data-kind="promotion"><rect fill="#9a6b13" height="40" opacity="0.22" rx="1" stroke="#9a6b13" width="225.0" x="648" y="554" /><text fill="#9a6b13" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="14.732143" font-weight="600" text-anchor="middle" x="760.5" y="571">promotion</text><text fill="#9a6b13" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="middle" x="760.5" y="587">raw × SFA × SFB → final acc</text></g><rect fill="#2a5780" height="40" opacity="0.9" rx="1" stroke="none" width="100" x="973.0" y="554" /><text fill="#fdfbf5" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="600" text-anchor="middle" x="1023.0" y="579">下一段 MMA</text><text fill="#9a6b13" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.767857" font-weight="normal" text-anchor="start" x="248" y="613">四组 MMA → promotion → 读下一段 SFA/SFB → 下一段 MMA；raw / final 两份累加器。</text></g><text fill="#9a6b13" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="12.767857" font-weight="normal" text-anchor="start" x="24" y="644">SFA/SFB 每 K128 读入一段，不参与每 K32 的 A/B 预取；promotion 使用本段 scale 后再读取下一段。</text><text fill="#8a8069" font-family="'Alibaba PuHuiTi 2','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif" font-size="11.785714" font-weight="normal" text-anchor="start" x="24" y="668">最后一轮 tsm.ld 已预取下一 stage 的首批 A/B，但同一 warp 仍须先完成 raw temp 的 promotion。</text></svg>