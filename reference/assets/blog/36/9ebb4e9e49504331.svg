<text class="a-sub" x="225" y="407">head request</text><text class="a-sub" x="445" y="407">head request</text><text class="a-sub" x="665" y="407">head request</text><text class="a-sub" x="885" y="407">head request</text>
<path class="a-grant" d="M225 420 L225 454 L405 454 L405 482" marker-end="url(#arbArrowGrantEmbedded)"></path>
<path class="a-reject" d="M445 420 L445 482" marker-end="url(#arbArrowRejectEmbedded)"></path>
<path class="a-grant" d="M665 420 L665 482" marker-end="url(#arbArrowGrantEmbedded)"></path>
<path class="a-reject" d="M885 420 L885 454 L715 454 L715 482" marker-end="url(#arbArrowRejectEmbedded)"></path>
<text class="a-grant-t" x="315" y="445">PU0→G0 Grant</text>
<text class="a-reject-t" x="445" y="448">PU1→G0 Reject</text>
<text class="a-grant-t" x="665" y="448">PU2→G2 Grant</text>
<text class="a-reject-t" x="800" y="445">PU3→G2 Reject</text>
<rect class="a-arb" height="74" rx="14" ry="14" width="410" x="355" y="485"></rect>
<text class="a-label" text-anchor="middle" x="560" y="514">TSM group arbitration</text>
<text class="a-muted" text-anchor="middle" x="560" y="538">priority: PU0 → PU1 → PU2 → PU3</text>
<text class="a-tiny" text-anchor="middle" x="560" y="554">同 group 同拍只 grant 一个 PU，其余 request 保留在队列 head，等待下一轮</text>
