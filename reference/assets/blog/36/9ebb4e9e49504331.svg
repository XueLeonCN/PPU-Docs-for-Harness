<rect class="a-g1" height="52" rx="9" ry="9" width="150" x="370" y="290"></rect>
<rect class="a-g3" height="52" rx="9" ry="9" width="150" x="590" y="290"></rect>
<rect class="a-g3" height="52" rx="9" ry="9" width="150" x="810" y="290"></rect>
<text class="a-cell" x="225" y="316">G1</text><text class="a-cell" x="445" y="316">G1</text><text class="a-cell" x="665" y="316">G3</text><text class="a-cell" x="885" y="316">G3</text>
<text class="a-sub" x="225" y="333">queued</text><text class="a-sub" x="445" y="333">queued</text><text class="a-sub" x="665" y="333">queued</text><text class="a-sub" x="885" y="333">queued</text>
<rect class="a-g0" height="60" rx="9" ry="9" width="150" x="150" y="360"></rect>
