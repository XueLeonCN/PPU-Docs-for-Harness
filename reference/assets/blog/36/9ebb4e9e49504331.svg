<text class="a-group" fill="#ef4444" x="885" y="636">group3</text>
<text class="a-sub" x="255" y="656">active · Grant</text>
<text class="a-sub" x="465" y="656">idle · no request</text>
<text class="a-sub" x="675" y="656">active · Grant</text>
<text class="a-sub" x="885" y="656">idle · no request</text>
<rect fill="#231a1f" height="28" rx="14" ry="14" stroke="#7a4d25" width="280" x="420" y="675"></rect>
<text fill="#ffcc66" font-size="12" font-weight="800" text-anchor="middle" x="560" y="694">本 cycle：2 / 4 group active，带宽利用约 50%</text>
</svg>