<path class="a-grant" d="M650 559 L620 604" marker-end="url(#arbArrowGrantEmbedded)"></path>
<text class="a-grant-t" x="382" y="590">access G0</text>
<text class="a-grant-t" x="636" y="590">access G2</text>
