<svg aria-label="4PU to 4TSM group arbitration logic" height="720" role="img" style='font-family:system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;' viewBox="0 0 1120 720" width="1120" xmlns="http://www.w3.org/2000/svg"><rect fill="#0b0f1a" height="100%" width="100%"></rect>
<defs>
<linearGradient id="arbGradEmbedded" x1="0" x2="1" y1="0" y2="0">
<stop offset="0" stop-color="#241a3a"></stop>
<stop offset="0.5" stop-color="#33245a"></stop>
<stop offset="1" stop-color="#241a3a"></stop>
</linearGradient>
<marker id="arbArrowGrantEmbedded" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="3">
<path d="M0,0 L8,3 L0,6 Z" fill="#22c55e"></path>
</marker>
<marker id="arbArrowRejectEmbedded" markerHeight="10" markerUnits="strokeWidth" markerWidth="10" orient="auto" refX="8" refY="3">
