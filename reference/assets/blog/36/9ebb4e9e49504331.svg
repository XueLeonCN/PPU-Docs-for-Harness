<path d="M0,0 L8,3 L0,6 Z" fill="#61708c"></path>
</marker>
<style>
          .a-panel { fill: #101725; stroke: #2a3550; stroke-width: 1.2; }
          .a-title { fill: #4da3ff; font-size: 12px; font-weight: 800; letter-spacing: .5px; }
          .a-label { fill: #e8edf7; font-size: 14px; font-weight: 800; }
          .a-muted { fill: #8a97b1; font-size: 12px; }
          .a-tiny { fill: #8a97b1; font-size: 10px; }
          .a-cell { fill: #e8edf7; font-size: 18px; font-weight: 900; text-anchor: middle; dominant-baseline: middle; }
          .a-sub { fill: rgba(232, 237, 247, .72); font-size: 10px; text-anchor: middle; dominant-baseline: middle; }
          .a-g0 { fill: #16294d; stroke: #3b82f6; stroke-width: 1.2; }
          .a-g1 { fill: #123a22; stroke: #22c55e; stroke-width: 1.2; }
          .a-g2 { fill: #5c3308; stroke: #f59e0b; stroke-width: 1.2; }
          .a-g3 { fill: #5c1616; stroke: #ef4444; stroke-width: 1.2; }
          .a-arb { fill: url(#arbGradEmbedded); stroke: #4b3a7a; stroke-width: 1.4; }
          .a-grant { stroke: #22c55e; stroke-width: 2.4; fill: none; }
          .a-reject { stroke: #ef4444; stroke-width: 2.2; fill: none; stroke-dasharray: 6 5; }
          .a-neutral { stroke: #61708c; stroke-width: 1.7; fill: none; }
          .a-grant-t { fill: #22c55e; font-size: 11px; font-weight: 800; text-anchor: middle; }
          .a-reject-t { fill: #ef4444; font-size: 11px; font-weight: 800; text-anchor: middle; }
          .a-group { font-size: 16px; font-weight: 900; text-anchor: middle; }
        </style>
</defs>
<rect class="a-panel" height="680" rx="12" ry="12" width="1084" x="18" y="20"></rect>
<text class="a-title" x="50" y="58">① PU request FIFO（tail → head）</text>
<text class="a-title" text-anchor="middle" x="560" y="58">② arbitration：按 priority 选择 grant</text>
<text class="a-title" x="50" y="600">③ TSM groups</text>
<text class="a-label" text-anchor="end" x="88" y="132">tail</text>
<text class="a-label" text-anchor="end" x="88" y="413">head</text>
<path class="a-neutral" d="M100 142 L100 382" marker-end="url(#arbArrowNeutralEmbedded)"></path>
<text class="a-tiny" text-anchor="middle" transform="rotate(-90 75 270)" x="75" y="270">request order</text>
