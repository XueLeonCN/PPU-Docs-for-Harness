  <rect x="180" y="198" width="544" height="20" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <text x="452" y="212" text-anchor="middle" class="t85 mut">⋮ lane 4..15</text>
  <rect x="180" y="218" width="544" height="22" fill="url(#bp)" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="180" y="240" width="544" height="22" fill="url(#bp)" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="180" y="262" width="544" height="22" fill="url(#bp)" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="180" y="284" width="544" height="22" fill="url(#bp)" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="180" y="306" width="544" height="20" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <text x="452" y="320" text-anchor="middle" class="t85 mut">⋮ lane 20..31</text>
  <line x1="316" y1="110" x2="316" y2="326" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="452" y1="110" x2="452" y2="326" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="588" y1="110" x2="588" y2="326" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="180" y="132" width="544" height="22" fill="none" stroke="#a855f7" stroke-width="2"/>
  <rect x="180" y="110" width="544" height="216" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <text x="174" y="123" text-anchor="end" class="m85 mut">L0</text>
  <text x="174" y="145" text-anchor="end" class="m85 pu" font-weight="700">L1</text>
  <text x="174" y="167" text-anchor="end" class="m85 mut">L2</text>
  <text x="174" y="189" text-anchor="end" class="m85 mut">L3</text>
  <text x="174" y="231" text-anchor="end" class="m85 mut">L16</text>
  <text x="174" y="253" text-anchor="end" class="m85 mut">L17</text>
  <text x="174" y="275" text-anchor="end" class="m85 mut">L18</text>
  <text x="174" y="297" text-anchor="end" class="m85 mut">L19</text>

  <!-- ① bfly xor2 蓝弧（左） -->
  <path d="M176,121 C126,121 126,165 176,165" fill="none" stroke="#3b82f6" stroke-width="1.4" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <path d="M176,143 C146,143 146,187 176,187" fill="none" stroke="#3b82f6" stroke-width="1.4" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <path d="M176,229 C126,229 126,273 176,273" fill="none" stroke="#3b82f6" stroke-width="1.4" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <path d="M176,251 C146,251 146,295 176,295" fill="none" stroke="#3b82f6" stroke-width="1.4" marker-start="url(#ab)" marker-end="url(#ab)"/>
  <text x="40" y="104" class="t85 bl">① bfly xor2</text>

  <!-- ③ shfl_idx ±15 绿弧（右） -->
  <path d="M728,150 C800,150 800,223 728,223" fill="none" stroke="#22c55e" stroke-width="1.4" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <path d="M728,172 C776,172 776,266 728,266" fill="none" stroke="#22c55e" stroke-width="1.4" marker-start="url(#ag)" marker-end="url(#ag)"/>
  <text x="806" y="160" class="t85 gr">③ shfl_idx</text>
  <text x="806" y="174" class="t85 gr">±15 跨半区</text>

  <!-- lane1 行 → 输出第 1 列 紫色追踪线 -->
  <path d="M724,135 H748 V66 H950 V546 H231 V554" fill="none" stroke="#a855f7" stroke-width="1.8" marker-end="url(#ap)"/>

  <!-- ===== 中间：图例 + mat.trans.b8 ===== -->
  <rect x="180" y="358" width="12" height="12" fill="#3b82f6"/>
  <text x="198" y="368" class="t95">① shfl_bfly_b32(x, 2, 124)：lane L ⇄ L^2 蝶形（4-lane 组内）—— 左侧蓝弧：0↔2、1↔3、16↔18、17↔19</text>
  <rect x="180" y="382" width="12" height="12" fill="#dbeafe" stroke="#93c5fd"/>
  <rect x="194" y="382" width="12" height="12" fill="#ffedd5" stroke="#fdba74"/>
  <text x="212" y="392" class="t95">② mov.w.msk(mask=0xCCCCCCCC)：b16 交替混合 → call3 取偶 / call4 取奇 b16（见输入块蓝/橙格）</text>
  <rect x="180" y="406" width="12" height="12" fill="#22c55e"/>
  <text x="198" y="416" class="t95">③ shfl_idx_b32(·, add.i, 992)：跨半区 ±15 —— 右侧绿弧 1↔16、3↔18</text>
  <text x="212" y="436" class="t85 mut">奇 lane 0..15 配 +15；偶 lane 与 17..31 为 self（不跨）</text>
  <text x="198" y="458" class="m85 mut">add.i = ltid + (((ltid&amp;1)==((ltid&gt;&gt;4)&amp;1)) ? 0 : (((ltid&gt;&gt;4)&amp;1)==0 ? +15 : −15))</text>

  <rect x="700" y="356" width="88" height="88" fill="#ffffff" stroke="#bbf7d0"/>
  <line x1="722" y1="356" x2="722" y2="444" stroke="#d1fae5"/>
  <line x1="744" y1="356" x2="744" y2="444" stroke="#d1fae5"/>
  <line x1="766" y1="356" x2="766" y2="444" stroke="#d1fae5"/>
  <line x1="700" y1="378" x2="788" y2="378" stroke="#d1fae5"/>
  <line x1="700" y1="400" x2="788" y2="400" stroke="#d1fae5"/>
  <line x1="700" y1="422" x2="788" y2="422" stroke="#d1fae5"/>
  <path d="M706,362 C730,388 758,406 780,436" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#a)"/>
  <text x="700" y="468" class="t85">④ mat.trans.b8（本 lane 内）</text>
  <text x="700" y="484" class="t85 mut">寄存器内 b8 转置 → t[0..3]</text>

  <!-- ===== 输出块 16×32 ===== -->
  <text x="180" y="530" class="t11b gr">输出：16 行 × 32 列 b8 —— lane L 持输出矩阵第 L 列 = t[0..3]（16 字节）</text>
  <text x="197" y="550" text-anchor="middle" class="t85 mut">L0</text>
  <text x="231" y="550" text-anchor="middle" class="t85 pu" font-weight="700">L1</text>
  <text x="265" y="550" text-anchor="middle" class="t85 mut">L2</text>
  <text x="299" y="550" text-anchor="middle" class="t85 mut">L3</text>
  <text x="330" y="550" text-anchor="middle" class="t85 mut">⋮</text>
  <text x="361" y="550" text-anchor="middle" class="t85 mut">L16</text>
  <text x="395" y="550" text-anchor="middle" class="t85 mut">L17</text>
  <text x="429" y="550" text-anchor="middle" class="t85 mut">L18</text>
  <text x="463" y="550" text-anchor="middle" class="t85 mut">L19</text>
  <text x="494" y="550" text-anchor="middle" class="t85 mut">⋮</text>

  <rect x="180" y="556" width="34" height="224" fill="url(#tp)" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="214" y="556" width="34" height="224" fill="url(#tp)" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="248" y="556" width="34" height="224" fill="url(#tp)" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="282" y="556" width="34" height="224" fill="url(#tp)" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="316" y="556" width="28" height="224" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <text x="330" y="672" text-anchor="middle" class="t85 mut">⋮</text>
  <rect x="344" y="556" width="34" height="224" fill="url(#tp)" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="378" y="556" width="34" height="224" fill="url(#tp)" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="412" y="556" width="34" height="224" fill="url(#tp)" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="446" y="556" width="34" height="224" fill="url(#tp)" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="480" y="556" width="28" height="224" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 3"/>
  <text x="494" y="672" text-anchor="middle" class="t85 mut">⋮</text>
  <line x1="180" y1="612" x2="508" y2="612" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="180" y1="668" x2="508" y2="668" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="180" y1="724" x2="508" y2="724" stroke="#94a3b8" stroke-width="0.8"/>
  <rect x="214" y="556" width="34" height="224" fill="none" stroke="#a855f7" stroke-width="2"/>
  <rect x="180" y="556" width="328" height="224" fill="none" stroke="#64748b" stroke-width="1.5"/>

  <text x="174" y="587" text-anchor="end" class="t85 bl">t[0]</text>
  <text x="174" y="643" text-anchor="end" class="t85 or">t[1]</text>
  <text x="174" y="699" text-anchor="end" class="t85 gr">t[2]</text>
  <text x="174" y="755" text-anchor="end" class="t85 pu">t[3]</text>

  <text x="530" y="590" class="t95">t[0]=行 0-3，t[1]=行 4-7，t[2]=行 8-11，t[3]=行 12-15</text>
  <text x="530" y="612" class="t95 pu">lane L 的 16B 输出 = 输出矩阵第 L 列</text>
  <text x="530" y="634" class="t85 mut">input[r][c] ↦ output[c][r]（行变列 = 转置）</text>

  <text x="180" y="800" class="t95 mut">数据流：lane L 持行 L 的 16B → ① bfly 组内交换 → ② b16 交错（call3/call4）→ ③ 跨半区 ±15 聚列 → ④ mat.trans.b8 落地 t[0..3]（输出第 L 列）</text>
</svg>
