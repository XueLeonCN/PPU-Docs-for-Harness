<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 812" width="1080" role="img" aria-label="图2 awmma 32x16 b8 寄存器转置数据流">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .t15 { font-size: 15px; font-weight: 700; }
      .t11b { font-size: 11px; font-weight: 600; }
      .t10 { font-size: 10.5px; }
      .t95 { font-size: 9.5px; }
      .t9 { font-size: 9px; }
      .t85 { font-size: 8.5px; }
      .m9 { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 9px; }
      .m85 { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 8.5px; }
      .mut { fill: #64748b; }
      .bl { fill: #1d4ed8; } .or { fill: #c2410c; } .gr { fill: #15803d; } .pu { fill: #7e22ce; } .rd { fill: #b91c1c; }
    </style>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7z" fill="#8a94a3"/>
    </marker>
    <marker id="ab" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0L6 3L0 6z" fill="#3b82f6"/>
    </marker>
    <marker id="ag" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0L6 3L0 6z" fill="#22c55e"/>
    </marker>
    <marker id="ap" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7z" fill="#a855f7"/>
    </marker>
    <pattern id="bp" x="180" width="68" height="22" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="34" height="22" fill="#dbeafe"/>
      <rect x="34" y="0" width="34" height="22" fill="#ffedd5"/>
      <path d="M0 0V22 M17 0V22 M34 0V22 M51 0V22" stroke="#b6c2d1" stroke-width="0.5"/>
    </pattern>
    <pattern id="tp" y="556" width="34" height="224" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="34" height="56" fill="#dbeafe"/>
      <rect x="0" y="56" width="34" height="56" fill="#ffedd5"/>
      <rect x="0" y="112" width="34" height="56" fill="#bbf7d0"/>
      <rect x="0" y="168" width="34" height="56" fill="#e9d5ff"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="1080" height="812" fill="#ffffff"/>
  <text x="20" y="30" class="t15">图2 · __awmma_matrix_trans_32x16_b8：warp 内寄存器转置 32×16 b8 → 16×32</text>
  <text x="20" y="46" class="t85 mut">两条对称流水：a[0], a[1] → t[0] / t[2]；a[2], a[3] → t[1] / t[3]</text>
  <text x="849" y="62" text-anchor="middle" class="t85 pu" font-weight="600">lane1 行 ↦ 输出第 1 列（行变列）</text>

  <!-- ===== 输入块 32×16 ===== -->
  <text x="180" y="86" class="t11b bl">输入：32 行 × 16 列 b8 —— lane L 持输入矩阵第 L 行（16 字节）= a[0..3]</text>
  <text x="170" y="104" text-anchor="end" class="t85 mut">lane ↓</text>
  <text x="248" y="104" text-anchor="middle" class="t85 mut">a[0]·列 0-3</text>
  <text x="384" y="104" text-anchor="middle" class="t85 mut">a[1]·列 4-7</text>
  <text x="520" y="104" text-anchor="middle" class="t85 mut">a[2]·列 8-11</text>
  <text x="656" y="104" text-anchor="middle" class="t85 mut">a[3]·列 12-15</text>

  <rect x="180" y="110" width="544" height="22" fill="url(#bp)" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="180" y="132" width="544" height="22" fill="url(#bp)" stroke="#cbd5e1" stroke-width="0.8"/>
  <rect x="180" y="154" width="544" height="22" fill="url(#bp)" stroke="#cbd5e1" stroke-width="0.8"/>
