<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 592" width="1080" role="img" aria-label="图1 初版 TSM 显式转置数据布局">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; fill: #1e293b; }
      .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .t15 { font-size: 15px; font-weight: 700; }
      .t12 { font-size: 12px; font-weight: 600; }
      .t11b { font-size: 11px; font-weight: 600; }
      .t11 { font-size: 11px; }
      .t10 { font-size: 10.5px; }
      .t95 { font-size: 9.5px; }
      .m95 { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 9.5px; }
      .m9 { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 9px; }
      .mut { fill: #64748b; }
      .bl { fill: #1d4ed8; } .or { fill: #c2410c; } .gr { fill: #15803d; } .pu { fill: #7e22ce; } .rd { fill: #b91c1c; }
    </style>
    <marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7z" fill="#8a94a3"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1080" height="592" fill="#ffffff"/>
  <text x="20" y="30" class="t15">图1 · 初版 TSM 显式转置（原地：sV / sVt / sV_raw / sVt_raw 四视图共享同一 smem_v）</text>

  <!-- ===== 左：sV_raw 视图 ===== -->
  <text x="20" y="60" class="t12 bl">sV_raw 视图：kv 行 × headdim 列（行主序 + Swizzle）</text>
  <text x="70" y="80" class="t95 mut">headdim →</text>
  <text x="62" y="109" text-anchor="end" class="m9 mut">kv0</text>
  <text x="62" y="143" text-anchor="end" class="m9 mut">kv1</text>
  <text x="62" y="177" text-anchor="end" class="m9 mut">kv2</text>
  <text x="62" y="211" text-anchor="end" class="m9 mut">kv3</text>
  <rect x="70" y="88" width="40" height="32" fill="#eff6ff" stroke="#bfdbfe"/><text x="90" y="109" text-anchor="middle" class="m9">b00</text>
  <rect x="112" y="88" width="40" height="32" fill="#eff6ff" stroke="#bfdbfe"/><text x="132" y="109" text-anchor="middle" class="m9">b01</text>
  <rect x="154" y="88" width="40" height="32" fill="#eff6ff" stroke="#bfdbfe"/><text x="174" y="109" text-anchor="middle" class="m9">b02</text>
  <rect x="196" y="88" width="40" height="32" fill="#eff6ff" stroke="#bfdbfe"/><text x="216" y="109" text-anchor="middle" class="m9">b03</text>
  <rect x="238" y="88" width="28" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 3"/><text x="252" y="109" text-anchor="middle" class="t95 mut">…</text>
  <rect x="70" y="122" width="40" height="32" fill="#eff6ff" stroke="#bfdbfe"/><text x="90" y="143" text-anchor="middle" class="m9">b10</text>
  <rect x="112" y="122" width="40" height="32" fill="#eff6ff" stroke="#bfdbfe"/><text x="132" y="143" text-anchor="middle" class="m9">b11</text>
  <rect x="154" y="122" width="40" height="32" fill="#eff6ff" stroke="#bfdbfe"/><text x="174" y="143" text-anchor="middle" class="m9">b12</text>
  <rect x="196" y="122" width="40" height="32" fill="#eff6ff" stroke="#bfdbfe"/><text x="216" y="143" text-anchor="middle" class="m9">b13</text>
  <rect x="238" y="122" width="28" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 3"/><text x="252" y="143" text-anchor="middle" class="t95 mut">…</text>
  <rect x="70" y="156" width="40" height="32" fill="#eff6ff" stroke="#bfdbfe"/><text x="90" y="177" text-anchor="middle" class="m9">b20</text>
  <rect x="112" y="156" width="40" height="32" fill="#eff6ff" stroke="#bfdbfe"/><text x="132" y="177" text-anchor="middle" class="m9">b21</text>
  <rect x="154" y="156" width="40" height="32" fill="#eff6ff" stroke="#bfdbfe"/><text x="174" y="177" text-anchor="middle" class="m9">b22</text>
  <rect x="196" y="156" width="40" height="32" fill="#eff6ff" stroke="#bfdbfe"/><text x="216" y="177" text-anchor="middle" class="m9">b23</text>
  <rect x="238" y="156" width="28" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 3"/><text x="252" y="177" text-anchor="middle" class="t95 mut">…</text>
  <rect x="70" y="190" width="40" height="32" fill="#eff6ff" stroke="#bfdbfe"/><text x="90" y="211" text-anchor="middle" class="m9">b30</text>
  <rect x="112" y="190" width="40" height="32" fill="#eff6ff" stroke="#bfdbfe"/><text x="132" y="211" text-anchor="middle" class="m9">b31</text>
  <rect x="154" y="190" width="40" height="32" fill="#eff6ff" stroke="#bfdbfe"/><text x="174" y="211" text-anchor="middle" class="m9">b32</text>
  <rect x="196" y="190" width="40" height="32" fill="#eff6ff" stroke="#bfdbfe"/><text x="216" y="211" text-anchor="middle" class="m9">b33</text>
  <rect x="238" y="190" width="28" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 3"/><text x="252" y="211" text-anchor="middle" class="t95 mut">…</text>
  <rect x="66" y="84" width="172" height="142" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="152" y="244" text-anchor="middle" class="t95 bl">每线程 uint4 = 4×4 字节块 M[r][c]</text>

  <!-- ===== 中间：四步流水 ===== -->
  <rect x="310" y="88" width="300" height="86" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="322" y="108" class="t11b">① S2R（L854-856）</text>
  <text x="322" y="126" class="t95">AutoVectorizingCopy 读 sV_raw 整块入寄存器</text>
  <text x="322" y="142" class="t95 mut">make_fragment_like：</text>
  <text x="322" y="158" class="m9">x=M[0][*]  y=M[1][*]  z=M[2][*]  w=M[3][*]</text>
  <line x1="460" y1="174" x2="460" y2="184" stroke="#8a94a3" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="310" y="186" width="300" height="34" rx="8" fill="#fef2f2" stroke="#fecaca"/>
  <text x="322" y="208" class="t11b rd">② __syncthreads（L857）：原地读写屏障</text>
  <line x1="460" y1="220" x2="460" y2="232" stroke="#8a94a3" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="310" y="234" width="300" height="118" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="322" y="254" class="t11b">③ 寄存器内 4×4 转置（L862-880）</text>
  <text x="322" y="272" class="t95">每 uint4 共 12 次 __byte_perm</text>
  <text x="322" y="290" class="m9">层 1 (x,y)：0x0040 0x0051 0x0062 0x0073</text>
  <text x="322" y="306" class="m9">层 2 (+z）：0x0410 0x0510 0x0610 0x0710</text>
  <text x="322" y="322" class="m9">层 3 (+w）：0x4210 0x5210 0x6210 0x7210</text>
  <text x="322" y="340" class="m9">x′=col0 y′=col1 z′=col2 w′=col3（M[r][c]→M[c][r]）</text>
  <line x1="460" y1="352" x2="460" y2="362" stroke="#8a94a3" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="310" y="364" width="300" height="82" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="322" y="384" class="t11b">④ R2S（L881-886）</text>
  <text x="322" y="402" class="m9">tTranssVt(_, j, i) 行列换位写回</text>
  <text x="322" y="420" class="t95">写沿列（kv）方向跨 bank</text>
  <text x="322" y="436" class="t95 or">→ 部分 headdim 下 bank 冲突不可避</text>

  <!-- 左→①，④→右 连接 -->
  <line x1="272" y1="131" x2="306" y2="131" stroke="#8a94a3" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M610,405 H646 V130 H692" fill="none" stroke="#8a94a3" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- ===== 右：sVt_raw 视图 ===== -->
  <text x="640" y="60" class="t12 gr">sVt_raw 视图：headdim 行 × kv 列</text>
  <text x="700" y="80" class="t95 mut">kv →</text>
  <text x="692" y="109" text-anchor="end" class="m9 mut">hd0</text>
  <text x="692" y="143" text-anchor="end" class="m9 mut">hd1</text>
  <text x="692" y="177" text-anchor="end" class="m9 mut">hd2</text>
  <text x="692" y="211" text-anchor="end" class="m9 mut">hd3</text>
  <rect x="700" y="88" width="40" height="32" fill="#f0fdf4" stroke="#bbf7d0"/><text x="720" y="109" text-anchor="middle" class="m9">b00</text>
  <rect x="742" y="88" width="40" height="32" fill="#f0fdf4" stroke="#bbf7d0"/><text x="762" y="109" text-anchor="middle" class="m9">b10</text>
  <rect x="784" y="88" width="40" height="32" fill="#f0fdf4" stroke="#bbf7d0"/><text x="804" y="109" text-anchor="middle" class="m9">b20</text>
  <rect x="826" y="88" width="40" height="32" fill="#f0fdf4" stroke="#bbf7d0"/><text x="846" y="109" text-anchor="middle" class="m9">b30</text>
  <rect x="868" y="88" width="28" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 3"/><text x="882" y="109" text-anchor="middle" class="t95 mut">…</text>
  <rect x="700" y="122" width="40" height="32" fill="#f0fdf4" stroke="#bbf7d0"/><text x="720" y="143" text-anchor="middle" class="m9">b01</text>
  <rect x="742" y="122" width="40" height="32" fill="#f0fdf4" stroke="#bbf7d0"/><text x="762" y="143" text-anchor="middle" class="m9">b11</text>
  <rect x="784" y="122" width="40" height="32" fill="#f0fdf4" stroke="#bbf7d0"/><text x="804" y="143" text-anchor="middle" class="m9">b21</text>
  <rect x="826" y="122" width="40" height="32" fill="#f0fdf4" stroke="#bbf7d0"/><text x="846" y="143" text-anchor="middle" class="m9">b31</text>
  <rect x="868" y="122" width="28" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 3"/><text x="882" y="143" text-anchor="middle" class="t95 mut">…</text>
  <rect x="700" y="156" width="40" height="32" fill="#f0fdf4" stroke="#bbf7d0"/><text x="720" y="177" text-anchor="middle" class="m9">b02</text>
  <rect x="742" y="156" width="40" height="32" fill="#f0fdf4" stroke="#bbf7d0"/><text x="762" y="177" text-anchor="middle" class="m9">b12</text>
  <rect x="784" y="156" width="40" height="32" fill="#f0fdf4" stroke="#bbf7d0"/><text x="804" y="177" text-anchor="middle" class="m9">b22</text>
  <rect x="826" y="156" width="40" height="32" fill="#f0fdf4" stroke="#bbf7d0"/><text x="846" y="177" text-anchor="middle" class="m9">b32</text>
  <rect x="868" y="156" width="28" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 3"/><text x="882" y="177" text-anchor="middle" class="t95 mut">…</text>
  <rect x="700" y="190" width="40" height="32" fill="#f0fdf4" stroke="#bbf7d0"/><text x="720" y="211" text-anchor="middle" class="m9">b03</text>
  <rect x="742" y="190" width="40" height="32" fill="#f0fdf4" stroke="#bbf7d0"/><text x="762" y="211" text-anchor="middle" class="m9">b13</text>
  <rect x="784" y="190" width="40" height="32" fill="#f0fdf4" stroke="#bbf7d0"/><text x="804" y="211" text-anchor="middle" class="m9">b23</text>
  <rect x="826" y="190" width="40" height="32" fill="#f0fdf4" stroke="#bbf7d0"/><text x="846" y="211" text-anchor="middle" class="m9">b33</text>
  <rect x="868" y="190" width="28" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="3 3"/><text x="882" y="211" text-anchor="middle" class="t95 mut">…</text>
  <text x="700" y="244" class="t95 or">▲ 写沿列（kv）方向跨 bank → 部分 headdim bank 冲突不可避</text>

  <!-- ===== 底部注 ===== -->
  <rect x="20" y="470" width="1040" height="104" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="36" y="494" class="m95">PV 读取：TSM_LD_SWZL&lt;Trans=false&gt;（L227-228，V 已物理转置，顺序读）</text>
  <text x="36" y="516" class="m95">↳ hdim256 且 kBlockN≤32 时回退 PPU_U32x4_LDSM_N（L239-240）</text>
  <text x="36" y="538" class="t10">调用点：softmax 后、PV 前串行插入（L1120-1125），含 lambda 内共 2 次 __syncthreads</text>
  <text x="36" y="560" class="t10 pu" font-weight="600">四视图 sV / sVt / sV_raw / sVt_raw 共享同一 smem_v —— 原地转置</text>
</svg>
